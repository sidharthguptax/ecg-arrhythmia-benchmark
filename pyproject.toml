[project]
name = "ecg_arrhythmia_benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roy Rimachi", email = "rj.rimachi@gmail.com" },
    { name = "Sidharth Gupta", email = "sidharthguptax@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "imbalanced-learn>=0.14.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.260113",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "wfdb>=4.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
fixable = ["ALL"]
ignore = ["C0114", "C0116"]

[tool.uv.workspace]
members = [
    "ecg_arrhythmia_benchmark",
]
