data:
  raw_dir: data/raw
  processed_dir: data/processed
  segment_length: 180        # samples per heartbeat (±90 around R-peak)
  test_size: 0.15
  val_size: 0.15
  random_seed: 42

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 7

models:
  cnn:
    filters: [32, 64, 128]
    kernel_size: 5
    dropout: 0.3
  lstm:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
  transformer:
    cnn_filters: [32, 64]
    d_model: 64
    nhead: 4
    num_layers: 2
    dropout: 0.3

classes:
  num_classes: 5
  labels: [N, L, R, V, A]